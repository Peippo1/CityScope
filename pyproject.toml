[project]
name = "cityscope"
version = "0.1.0"
description = "Deterministic geospatial vertical slice for CityScope"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "h3>=4.1,<5",
  "httpx>=0.27,<1",
    "mcp>=1.27,<2",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pyarrow>=17,<24",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pip-audit>=2.7,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["apps*", "pipelines*"]
