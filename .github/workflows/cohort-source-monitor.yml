name: Historical cohort source monitor

on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pinned-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate matched snapshot and probe official sources
        run: python scripts/check_cohort_sources.py --probe
