name: CityScope checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build deterministic test fixture
        run: python -m pipelines.london_cycling.build_fixture
      - name: Python tests
        run: pytest -q
      - name: Deterministic agent evaluations
        run: python -m evals.agent.runner --json-output /tmp/cityscope-eval-report.json
      - name: Python dependency audit
        run: pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: npm dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Install Chromium for mocked UI tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Mocked UI acceptance tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Next production build
        working-directory: apps/web
        run: npm run build
      - name: Check whitespace
        run: git diff --check
